<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Appointment</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Edit Appointment</h1>
            <p>Update the patient appointment details below.</p>
        </header>
        <main>
            <section class="form-card">
                <h2>Appointment Details</h2>
                <div id="message" class="message-card" hidden></div>
                <form id="editForm">
                    <input type="hidden" id="id" name="id">

                    <label for="patient_name">Patient Name</label>
                    <input type="text" id="patient_name" name="patient_name" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>

                    <label for="phone">Phone</label>
                    <input type="tel" id="phone" name="phone" required>

                    <label for="appointment_date">Appointment Date</label>
                    <input type="date" id="appointment_date" name="appointment_date" required>

                    <label for="appointment_time">Appointment Time</label>
                    <input type="time" id="appointment_time" name="appointment_time" required>

                    <label for="doctor">Doctor</label>
                    <select id="doctor" name="doctor" required>
                        <option value="">Select a doctor</option>
                        <option value="Dr. A. Patel">Dr. A. Patel</option>
                        <option value="Dr. S. Mehta">Dr. S. Mehta</option>
                        <option value="Dr. N. Singh">Dr. N. Singh</option>
                        <option value="Dr. R. Kumar">Dr. R. Kumar</option>
                    </select>

                    <label for="reason">Reason for Visit</label>
                    <textarea id="reason" name="reason" rows="4"></textarea>

                    <button type="submit">Save Changes</button>
                </form>
                <div class="actions">
                    <a class="button-link" href="appointments.html">Cancel</a>
                </div>
            </section>
        </main>
    </div>
    <script src="js/api.js"></script>
    <script src="js/edit.js"></script>
</body>
</html>
